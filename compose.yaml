# HedronDojo kernel. Stranger path pulls the published image; nothing builds on first run.
# Contributors: docker compose -f compose.yaml -f compose.dev.yaml up --build -d
# HEDRONOS_KERNEL_IMAGE, HEDRONOS_KERNEL_TAG, and HEDRONOS_PORT are deprecated
# fallbacks used only when the matching HEDRONDOJO_* variable is unset.
name: hedrondojo

services:
  kernel:
    image: ${HEDRONDOJO_KERNEL_IMAGE:-${HEDRONOS_KERNEL_IMAGE:-ghcr.io/hedronite/hedrondojo-kernel}}:${HEDRONDOJO_KERNEL_TAG:-${HEDRONOS_KERNEL_TAG:-latest}}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HEDRONDOJO_PORT:-${HEDRONOS_PORT:-18800}}:18800"
    volumes:
      - ./seed:/var/hedron/seed:ro
      - lab-data:/var/hedron/data
      - ./vault:/var/hedron/vault
    environment:
      LESSONS_FEED: https://hedronite.com
      LATTICE_DB: /var/hedron/data/lattice.db
      LAB_BIND: 0.0.0.0
      LAB_PORT: "18800"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18800/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  lab-data:
